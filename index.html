  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #072f7c;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    .search-bar {
      margin: 1rem auto;
      text-align: center;
    }

    .search-bar input {
      padding: 0.6rem;
      width: 80%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .store {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }

    .card {
      position: relative;
      width: 210px;
      /* atau ukuran yang kamu pakai */
      height: 100%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s;

      /* tambahkan jarak antar kartu */
      margin: 20px;
      /* ini kira-kira jarak yang enak dilihat */
    }


    .card:hover {
      transform: scale(1.02);
    }

    .card img {
      width: 100%;
      height: 50%;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 45%;
      /* sisa tinggi dari gambar */
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .price {
      color: #00a86b;
      margin-bottom: 0.8rem;
      margin-top: auto;
    }

    .buy-btn,
    .pay-btn,
    .back-btn,
    .confirm-btn {
      margin-top: auto;
      display: block;
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: #0053f8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .invoice,
    .success,
    .wallet-page {
      max-width: 500px;
      margin: 3rem auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
    }

    .detail,
    .field {
      margin: 1rem 0;
      font-size: 1.1rem;
    }

    select,
    input[type="tel"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .success-message {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: green;
      text-align: center;
    }

    .countdown {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }

    .discount-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: red;
      color: white;
      border-radius: 50%;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: bold;
      display: none;
      z-index: 2;
    }

    .discount-badge.show {
      display: inline-block;
    }

    .old-price {
      color: red;
      text-decoration: line-through;
      font-size: 0.85rem;
    }

    .card-content .author,
    .card-content .character,
    .card-content .year,
    .card-content .synopsis {
      margin-top: 1px;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .card-content .synopsis {
      font-style: italic;
      color: #555;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

        return;
      }

      currentOrder.method = method;

          renderDanaPage();
        } else if (method === "ShopeePay") {

        } else if (method === "BRI") {
          renderBRIPage();
        }
      }
    }

    function compressImage(file, callback) {
      var reader = new FileReader();
      reader.onload = function (event) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var MAX_WIDTH = 800;  // Tentukan lebar maksimal
          var MAX_HEIGHT = 800; // Tentukan tinggi maksimal
          var width = img.width;
          var height = img.height;

          // Jika gambar lebih besar dari ukuran maksimum, sesuaikan
          if (width > MAX_WIDTH || height > MAX_HEIGHT) {
            if (width > height) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            } else {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          // Tentukan ukuran kanvas sesuai ukuran gambar
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Konversi gambar menjadi data URL dan kirimkan ke callback
          canvas.toBlob(function (blob) {
            callback(blob);  // Blob gambar yang telah dikompres
          }, 'image/jpeg', 0.7);  // Mengatur kualitas kompresi
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Fungsi untuk mengirim bukti transfer dan data invoice ke email
    function submitProof() {
      const fileInput = document.getElementById("screenshot");
      if (fileInput.files.length === 0) {
        alert("Upload screenshot transfer dulu ya!");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onloadend = function () {
        const base64Image = reader.result.split(",")[1];

        const CLIENT_ID = "5d17f78f3a9cfc4"; // Client ID Imgur kamu

        fetch("https://api.imgur.com/3/image", {
          method: "POST",
          headers: {

          body: JSON.stringify({
            image: base64Image,
            type: "base64",
